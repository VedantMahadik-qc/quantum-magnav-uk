[workspace]
resolver = "3"
members = ["crates/magnav-core", "crates/magnav-cli", "crates/magnav-py"]

# Shared metadata: each crate opts in with `edition.workspace = true` etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Vedant"]
repository = "https://github.com/your-username/quantum-magnav-uk"

# One place to pin versions; crates opt in with `foo.workspace = true`.
[workspace.dependencies]
magnav-core = { path = "crates/magnav-core" }
ndarray = "0.17"
ndarray-npy = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.12"
rand = "0.10"
rand_distr = "0.6"
rand_xoshiro = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
tempfile = "3"
approx = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.bench]
debug = true
